<!-- Google Translate Floating Widget -->
<div id="google-translate-widget-container">
  <!-- Floating Toggle Button -->
  <button
    id="translate-toggle-btn"
    class="translate-float-btn"
    aria-label="Translation Options"
    title="Translate"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"
      />
    </svg>
  </button>

  <!-- Language Dropdown Panel -->
  <div id="translate-panel" class="translate-panel" style="display: none">
    <div class="translate-panel-header">
      <span>Translate to:</span>
      <button
        id="translate-close-btn"
        class="translate-close-btn"
        aria-label="Close translation panel"
        title="Close"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="translate-panel-body">
      <!-- Google Translate Element -->
      <div style="margin-bottom: 16px">
        <label
          style="
            display: block;
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 6px;
            font-weight: 500;
          "
          >Select Language:</label
        >
        <div id="google_translate_element"></div>
      </div>
      <!-- Quick Language Buttons -->
      <div
        style="
          margin-top: 16px;
          padding-top: 16px;
          border-top: 1px solid #e9ecef;
        "
      >
        <label
          style="
            display: block;
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 8px;
            font-weight: 500;
          "
          >Quick Select:</label
        >
        <div class="quick-lang-buttons">
          <button class="lang-btn" data-lang="en" title="English">
            🇺🇸 English
          </button>
          <button
            class="lang-btn lang-btn-primary"
            data-lang="tl"
            title="Filipino"
          >
            🇵🇭 Filipino
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Google Translate Script -->
<script type="text/javascript">
  function googleTranslateElementInit() {
    console.log("Google Translate initializing...");
    try {
      new google.translate.TranslateElement(
        {
          pageLanguage: "en",
          includedLanguages: "en,tl",
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false,
        },
        "google_translate_element",
      );
      console.log("Google Translate initialized successfully");

      // Wait a bit then check if the select element exists
      setTimeout(function () {
        const select = document.querySelector(".goog-te-combo");
        console.log("Select element after init:", select);
        if (select) {
          console.log("Available language options:");
          Array.from(select.options).forEach((opt) => {
            console.log("-", opt.value, ":", opt.text);
          });
        }
      }, 2000);
    } catch (error) {
      console.error("Error initializing Google Translate:", error);
    }
  }

  // Widget functionality
  (function () {
    // Wait for DOM to be ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initTranslateWidget);
    } else {
      initTranslateWidget();
    }

    function initTranslateWidget() {
      const toggleBtn = document.getElementById("translate-toggle-btn");
      const closeBtn = document.getElementById("translate-close-btn");
      const panel = document.getElementById("translate-panel");
      const langButtons = document.querySelectorAll(".lang-btn");

      if (!toggleBtn || !panel) return;

      // Toggle panel visibility
      toggleBtn.addEventListener("click", function () {
        const isVisible = panel.style.display !== "none";
        panel.style.display = isVisible ? "none" : "block";
        toggleBtn.setAttribute("aria-expanded", !isVisible);
      });

      // Close button
      if (closeBtn) {
        closeBtn.addEventListener("click", function () {
          panel.style.display = "none";
          toggleBtn.setAttribute("aria-expanded", "false");
        });
      }

      // Quick language button clicks
      langButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          const targetLang = btn.getAttribute("data-lang");
          triggerGoogleTranslate(targetLang);

          // Update button states
          langButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });

      // Keyboard accessibility
      toggleBtn.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleBtn.click();
        }
      });

      // Close panel when clicking outside
      document.addEventListener("click", function (e) {
        const container = document.getElementById(
          "google-translate-widget-container",
        );
        if (container && !container.contains(e.target)) {
          panel.style.display = "none";
          toggleBtn.setAttribute("aria-expanded", "false");
        }
      });
    }

    // Trigger translation programmatically
    function triggerGoogleTranslate(langCode) {
      console.log("Attempting to translate to:", langCode);

      // Wait for Google Translate to fully load
      let attempts = 0;
      const maxAttempts = 30;

      const tryTranslate = setInterval(function () {
        const selectElem = document.querySelector(".goog-te-combo");
        const iframe = document.querySelector("iframe.goog-te-menu-frame");

        console.log(
          "Attempt",
          attempts,
          "- Select found:",
          !!selectElem,
          "- Iframe found:",
          !!iframe,
        );

        if (selectElem) {
          clearInterval(tryTranslate);
          console.log("Found select element, triggering translation");

          // Set the value
          selectElem.value = langCode;

          // Try multiple event dispatch methods
          selectElem.dispatchEvent(new Event("change", { bubbles: true }));

          // Also try firing the event the old-fashioned way
          if (selectElem.fireEvent) {
            selectElem.fireEvent("onchange");
          }

          // Try triggering a click event as well
          selectElem.dispatchEvent(new Event("click", { bubbles: true }));

          // Close panel after translation starts
          setTimeout(function () {
            const panel = document.getElementById("translate-panel");
            if (panel) panel.style.display = "none";
          }, 500);
        } else {
          attempts++;
          if (attempts >= maxAttempts) {
            clearInterval(tryTranslate);
            console.error(
              "Google Translate not ready after",
              maxAttempts,
              "attempts",
            );
            console.log("Available elements:", {
              combo: document.querySelector(".goog-te-combo"),
              gadget: document.querySelector(".goog-te-gadget"),
              element: document.getElementById("google_translate_element"),
            });
          }
        }
      }, 150);
    }

    // Clean up Google Translate's default UI elements
    function cleanupGoogleTranslateUI() {
      // Hide the top banner
      const banner = document.querySelector(".goog-te-banner-frame");
      if (banner) {
        banner.style.display = "none";
      }

      // Remove body top margin added by Google Translate
      if (document.body) {
        document.body.style.top = "0";
        document.body.style.position = "static";
      }

      // Hide the default Google Translate branding in our custom panel
      const gadget = document.querySelector(".goog-te-gadget");
      if (gadget) {
        const font = gadget.querySelector("font");
        const span = gadget.querySelector("span");
        if (font) font.style.display = "none";
        if (span && span.textContent.includes("Powered by")) {
          span.style.display = "none";
        }
      }
    }

    // Run cleanup after Google Translate loads
    const observer = new MutationObserver(function (mutations) {
      cleanupGoogleTranslateUI();
    });

    if (document.body) {
      observer.observe(document.body, {
        childList: true,
        subtree: true,
      });
    }

    // Run cleanup once after a delay
    setTimeout(cleanupGoogleTranslateUI, 1000);
    setTimeout(cleanupGoogleTranslateUI, 3000);
  })();
</script>

<script
  type="text/javascript"
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
></script>

<noscript>
  <p
    style="
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
    "
  >
    Translation widget requires JavaScript to be enabled.
  </p>
</noscript>
